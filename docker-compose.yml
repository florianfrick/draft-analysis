# Environment for the LoL draft models. See DOCKER.md for usage.
#
# The whole repo is bind-mounted at /workspace so edits are live and anything
# the container writes (checkpoints, test_report.json, wandb runs) lands on the
# host. Data and checkpoints are never baked into the image.

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: lol-draft:dev
    working_dir: /workspace
    volumes:
      - .:/workspace
      # keeps the HuggingFace/torch download caches off the bind mount and
      # alive across `docker compose run --rm` invocations
      - torch-cache:/root/.cache
    # Riot + W&B keys. Optional so the container still starts without a .env.
    env_file:
      - path: .env
        required: false
    environment:
      # W&B run directories are chosen by each trainer, not here: every
      # training script passes `dir=<its own model folder>/wandb_runs` to
      # `wandb.init`, so a run lands next to the code that produced it and
      # never at the repo root. `WANDB_DIR` is deliberately unset - it would
      # be a silent global override of that per-trainer default.
      WANDB_START_METHOD: thread
      PYTHONUNBUFFERED: "1"
      # The corpus DB is on the bind mount, where gRPC-FUSE charges ~1 ms per
      # random read; `schema.connect` copies it here and opens the copy. Same
      # six queries: 24.05 s on the mount, 0.46 s local (see `_local_copy`).
      LOL_DB_CACHE: /tmp
    # DataLoader workers + torch allocator need more than the 64MB default
    shm_size: 2gb
    # PID 1 reaper, so Ctrl-C on a training run actually kills the process
    # group instead of leaving orphans holding the GPU
    init: true
    tty: true
    stdin_open: true
    command: bash
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # The same checkout, served with the LLM reranker in the loop. Identical
  # mounts to `dev` - the difference is the derived image, which has a compiler
  # and puts pro/model/archive/llm/.venv on PATH, so `python` there has
  # transformers,
  # peft and bitsandbytes. `docker compose run llm ...` is the only way to get
  # a browser at the reranker: the base image has none of those packages, and
  # `pro/model/archive/llm/run.sh` (the training wrapper) publishes no port.
  #
  # `frontend/serve.sh` is the one-line version of this.
  llm:
    build:
      context: .
      dockerfile: pro/model/archive/llm/Dockerfile
    image: lol-draft:llm
    working_dir: /workspace
    volumes:
      - .:/workspace
      - torch-cache:/root/.cache
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      TOKENIZERS_PARALLELISM: "false"
      # 4.2B in 4-bit against an 8 GB card: without this the allocator
      # fragments and reserves past the card (measured in
      # pro/model/archive/llm/run.sh).
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      WANDB_START_METHOD: thread
      LOL_DB_CACHE: /tmp
    shm_size: 2gb
    init: true
    stdin_open: true
    command: bash
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  torch-cache:
