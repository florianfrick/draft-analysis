name = "draft-assistant-chat"
main = "src/index.js"
compatibility_date = "2026-11-19"

[vars]
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-flash"
DAILY_LIMIT = "30"
MAX_TOKENS = "900"

[[kv_namespaces]]
binding = "CHAT_QUOTA"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[[ratelimits]]
name = "CHAT_BURST"
namespace_id = "1001"
simple = { limit = 8, period = 60 }
