<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Draft Assistant — pro-only model</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Draft Assistant</h1>
  <div class="spacer"></div>
  <label class="muted fp-label" title="Patch the next-move model conditions on:
    one row of the loaded checkpoint's own patch vocabulary, not a free-text
    label. Opens on 16.20, the Worlds knockout patch, because that is where the
    walkthrough's default filter lands and where most of the recent corpus is.
    Also the default patch for the 'why this move?' notes. Disabled when the
    checkpoint has no patch table, because then the choice would do nothing.">patch
    <select id="patch-select"></select>
  </label>
  <label class="muted agent-feat" title="When on, the agent chat and the LLM's
    reranked suggestions are shown. When off, only the base model's own
    suggestions and the board updates remain - the agent never runs.">
    <input type="checkbox" id="agent-features" checked> agent features
  </label>
  <button id="btn-wt" aria-expanded="false" title="show or hide the walkthrough
    of real pro games - a game picker, its moves one at a time, and how the
    head ranked the move the pros actually made">Real draft ▾</button>
</header>

<div id="board-error" class="hidden"></div>

<div id="series-bar">
  <span class="sb-title" title="A series is a list of games that share one
    fearless pool. Game 1 starts empty; each later game cannot pick any
    champion picked in an earlier one.">Series</span>
  <div id="series-games" class="series-games"></div>
  <button id="series-add" title="add an empty game to the series">＋ game</button>
  <button id="series-next" class="sb-next" title="close this game and open
    the next one: every champion picked here becomes unavailable there. The
    pool is defined exactly that way in the pro corpus (verified on all
    10,021 fearless rows), and the first-pick side is kept because it stays
    the same across a series in 94% of pro games.">next game in series ▶</button>
  <span class="spacer"></span>
  <span id="series-info" class="muted"></span>
  <button id="series-clear" title="forget every game and the fearless pool">clear</button>
</div>

<div id="fearless-bar">
  <span class="fb-title" title="Champions picked in an earlier game of this
    series. The next-move model excludes them from every suggestion, pick or
    ban: pro teams never ban one of these, so it should never be offered. A
    board that already bans one still loads - it is legal, just never done.">Fearless</span>
  <div class="strip fb-strip" id="fearless-strip"></div>
  <button id="fearless-add" title="add a champion that is already gone">＋ fearless ban</button>
  <span id="fearless-note" class="muted"></span>
</div>

<section id="nextmove" class="hidden">
  <div class="nm-head">
    <span id="nm-turn"></span>
    <span id="nm-meta" class="muted"></span>
    <span class="spacer"></span>
  </div>
  <div id="nm-subtitle" class="nm-subtitle">Base model suggestions</div>
  <div id="nm-warning" class="nm-warn hidden"></div>
  <div class="nm-chips" id="nm-chips"></div>
</section>

<section id="agentsuggest">
  <div class="nm-head">
    <span class="nm-title">Agent suggestions <span class="muted">(rerank
      of the head's list)</span></span>
    <span id="as-meta" class="muted"></span>
    <span class="spacer"></span>
  </div>
  <div id="as-warning" class="nm-warn hidden"></div>
  <div class="nm-chips" id="as-chips"></div>
</section>

<section id="agent">
  <div class="ex-head">
    <span id="agent-title">Agent</span>
    <span id="agent-model" class="agent-model"></span>
    <span id="agent-meta" class="muted"></span>
    <span class="spacer"></span>
    <button id="agent-suggest" title="one click: ask the agent (not the
      next-move head) to recommend the single best move on this board. It reads
      the live state - patch, first pick, series game, fearless pool, picks and
      bans - calls the head and the role table through tools, and commits to one
      champion. Needs LLM_API_KEY.">suggest next move</button>
    <button id="agent-clear" title="forget the conversation, keep the board">clear</button>
    <button id="agent-close" title="hide this panel">✕</button>
  </div>
  <div id="agent-log"></div>
  <form id="agent-form">
    <input id="agent-input" autocomplete="off"
      placeholder="e.g. what does the model take for red's jungle?">
    <button id="agent-send" type="submit">ask</button>
  </form>
</section>

<div id="wt-bar" class="hidden">
  <span class="wt-title">Real draft</span>
  <select id="wt-select"><option value="">— pick a game —</option></select>
  <input id="wt-filter" type="text" value="WLDs"
    placeholder="filter team / league / date…">
  <button id="wt-random" title="load a random game">🎲 random</button>
  <span class="spacer"></span>
  <span id="wt-info" class="muted">no game loaded</span>
  <button id="wt-prev" disabled title="undo the last move">◀</button>
  <span id="wt-step" class="wt-step"></span>
  <button id="wt-next" disabled title="apply the next real move">next real move ▶</button>
  <button id="wt-exit" disabled title="leave the walkthrough">✕</button>
</div>
<div id="wt-compare" class="hidden"></div>

<main>
  <div class="board-tools">
    <label class="muted fp-label" title="who has first pick in the game on the
      board (mirrors the whole draft order; ignored while a real game is
      loaded). Per game: the side holding it stays the same across a series
      in 94% of pro games, even though the teams swap sides.">first pick
      <select id="first-pick">
        <option value="0">blue</option>
        <option value="1">red</option>
      </select>
    </label>
    <button id="btn-reset" title="clear this game's picks and bans, keeping
      the fearless pool">Reset draft</button>
  </div>

  <section class="team" id="team-blue">
    <h2>Blue side <span class="turn" id="turn-blue"></span></h2>
    <div class="row">
      <span class="row-label">Bans</span>
      <div class="strip" id="bans-blue"></div>
    </div>
    <div class="row">
      <span class="row-label">Picks</span>
      <div class="strip" id="slots-blue"></div>
    </div>
    <div class="row role-row">
      <span class="row-label" title="picked champions placed in their most
        likely role; an empty role shows the model's target for it">Role board</span>
      <div class="strip role-strip" id="roles-blue"></div>
    </div>
  </section>

  <section class="team" id="team-red">
    <h2>Red side <span class="turn" id="turn-red"></span></h2>
    <div class="row">
      <span class="row-label">Bans</span>
      <div class="strip" id="bans-red"></div>
    </div>
    <div class="row">
      <span class="row-label">Picks</span>
      <div class="strip" id="slots-red"></div>
    </div>
    <div class="row role-row">
      <span class="row-label" title="picked champions placed in their most
        likely role; an empty role shows the model's target for it">Role board</span>
      <div class="strip role-strip" id="roles-red"></div>
    </div>
  </section>
</main>

<div id="picker" class="hidden">
  <div class="picker-box">
    <div class="picker-head">
      <h3 id="picker-title">Pick a champion</h3>
      <input id="picker-search" type="text" placeholder="search…" autofocus>
      <button id="picker-close">✕</button>
    </div>
    <div id="picker-grid" class="picker-grid"></div>
  </div>
</div>

<script src="/draft-order.js"></script>
<script src="/app.js"></script>
<script src="/agent.js"></script>
</body>
</html>
